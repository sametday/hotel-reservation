{% extends "base.html" %}
{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 rounded-4 p-4 shadow" style="background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px);">
                <div class="card-body text-center">
                    <i class="bi bi-envelope-at-fill display-4 text-warning"></i>
                    <h3 class="fw-bold mt-2 text-white">Şifremi Unuttum</h3>
                    <p class="text-white-50 small">E-posta adresinizi girin, size şifre sıfırlama bağlantısı gönderelim.</p>
                    <form action="/forgot-password" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-4 text-start">
                            <input type="email" name="email" class="form-control form-control-lg bg-dark text-white border-secondary" placeholder="ornek@mail.com" required>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2">Sıfırlama Linki Gönder</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
