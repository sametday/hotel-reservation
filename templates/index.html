{% extends "base.html" %}
{% block content %}

<!-- HERO BÖLÜMÜ (Ana Arama Ekranı) -->
<div class="hero-section position-relative" style="background: url('https://images.unsplash.com/photo-1542314831-c6a4d14d2315') center/cover no-repeat; min-height: 85vh; display: flex; align-items: center;">
    <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark" style="opacity: 0.65;"></div>
    
    <div class="container position-relative z-index-1 text-center text-white mt-5">
        <h1 class="display-3 fw-bold mb-3" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.6);">{{ t('hero_title') }}</h1>
        <p class="fs-4 mb-5 text-white-50" style="text-shadow: 1px 1px 3px rgba(0,0,0,0.6);">{{ t('hero_desc') }}</p>

        <!-- ARAMA ÇUBUĞU (Glassmorphism & Görünür Etiketler) -->
        <div class="card border-0 rounded-4 p-4 mx-auto glass-search-card" style="max-width: 1050px; background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(20px); box-shadow: 0 15px 35px rgba(0,0,0,0.4);">
            <form action="/search" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="row g-3 text-start align-items-end">
                    
                    <!-- İl Seçimi -->
                    <div class="col-md-2">
                        <label class="form-label fw-bold text-white mb-2 small letter-spacing-1"><i class="bi bi-geo-alt text-info me-1"></i>{{ t('city') }}</label>
                        <select name="city" id="searchCity" class="form-select form-select-lg bg-dark text-white border-secondary shadow-none">
                            <option value="">{{ t('select') }}</option>
                        </select>
                    </div>

                    <!-- İlçe Seçimi -->
                    <div class="col-md-2">
                        <label class="form-label fw-bold text-white mb-2 small letter-spacing-1"><i class="bi bi-map text-info me-1"></i>{{ t('district') }}</label>
                        <select name="district" id="searchDistrict" class="form-select form-select-lg bg-dark text-white border-secondary shadow-none">
                            <option value="">{{ t('select_city_first') }}</option>
                        </select>
                    </div>

                    <!-- Giriş Tarihi -->
                    <div class="col-md-2">
                        <label class="form-label fw-bold text-white mb-2 small letter-spacing-1"><i class="bi bi-calendar-check text-info me-1"></i>{{ t('checkin') }}</label>
                        <input type="date" name="checkin" id="checkin" class="form-control form-control-lg bg-dark text-white border-secondary shadow-none" required>
                    </div>

                    <!-- Çıkış Tarihi -->
                    <div class="col-md-2">
                        <label class="form-label fw-bold text-white mb-2 small letter-spacing-1"><i class="bi bi-calendar-x text-info me-1"></i>{{ t('checkout') }}</label>
                        <input type="date" name="checkout" id="checkout" class="form-control form-control-lg bg-dark text-white border-secondary shadow-none" required>
                    </div>

                    <!-- Yetişkin -->
                    <div class="col-md-1">
                        <label class="form-label fw-bold text-white mb-2 small letter-spacing-1">{{ t('adults') }}</label>
                        <input type="number" name="adults" class="form-control form-control-lg bg-dark text-white border-secondary text-center shadow-none" value="2" min="1" required>
                    </div>

                    <!-- Çocuk -->
                    <div class="col-md-1">
                        <label class="form-label fw-bold text-white mb-2 small letter-spacing-1">{{ t('children') }}</label>
                        <input type="number" name="children" class="form-control form-control-lg bg-dark text-white border-secondary text-center shadow-none" value="0" min="0" required>
                    </div>

                    <!-- Arama Butonu -->
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-lg w-100 fw-bold shadow-lg text-white border-0" style="background: linear-gradient(45deg, #38bdf8, #0ea5e9); height: 48px; border-radius: 10px;">
                            <i class="bi bi-search me-1"></i> {{ t('search_btn') }}
                        </button>
                    </div>
                    
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .letter-spacing-1 { letter-spacing: 0.5px; }
    /* Dark input takvim ikonunu (picker) beyaz yapma hilesi */
    ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    
    .glass-search-card select:focus, 
    .glass-search-card input:focus {
        border-color: #38bdf8 !important;
        box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25) !important;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const citySelect = document.getElementById('searchCity');
        const districtSelect = document.getElementById('searchDistrict');
        
        // JINJA'DAN JAVASCRIPT'E DİNAMİK ÇEVİRİ AKTARIMI
        const txtSelect = "{{ t('select') }}";
        const txtSelectCityFirst = "{{ t('select_city_first') }}";

        // İl - İlçe API Bağlantısı
        if(citySelect && districtSelect) {
            fetch('/api/v1/locations')
                .then(response => response.json())
                .then(res => {
                    if(res.status === "success") {
                        const locationData = res.data;
                        
                        // Şehirleri doldur
                        Object.keys(locationData).sort().forEach(city => {
                            const option = document.createElement('option');
                            option.value = city;
                            option.textContent = city;
                            citySelect.appendChild(option);
                        });

                        // Şehir değişince İlçeleri getir ve ÇEVİRİ DEĞİŞKENLERİNİ kullan
                        citySelect.addEventListener('change', function() {
                            const selectedCity = this.value;
                            districtSelect.innerHTML = ''; 

                            if(selectedCity && locationData[selectedCity]) {
                                // Dinamik olarak İngilizce/Türkçe "Seçiniz" yazacak
                                districtSelect.innerHTML = `<option value="">${txtSelect}</option>`;
                                locationData[selectedCity].forEach(function(district) {
                                    const option = document.createElement('option');
                                    option.value = district;
                                    option.textContent = district;
                                    districtSelect.appendChild(option);
                                });
                            } else {
                                // Dinamik olarak İngilizce/Türkçe "Önce İl Seçin" yazacak
                                districtSelect.innerHTML = `<option value="">${txtSelectCityFirst}</option>`;
                            }
                        });
                    }
                })
                .catch(err => console.error("Lokasyon API Hatası:", err));
        }

        // Tarih Kısıtlamaları (Geçmişe rezervasyon yapılmasını engeller)
        function getLocalISODate(date) {
            let offset = date.getTimezoneOffset() * 60000;
            return (new Date(date - offset)).toISOString().split('T')[0];
        }
        
        const todayDate = new Date();
        const tomorrowDate = new Date(todayDate);
        tomorrowDate.setDate(tomorrowDate.getDate() + 1);

        const checkinInput = document.getElementById('checkin');
        const checkoutInput = document.getElementById('checkout');

        if(checkinInput && checkoutInput) {
            checkinInput.min = getLocalISODate(todayDate);
            checkoutInput.min = getLocalISODate(tomorrowDate);

            checkinInput.addEventListener('change', function() {
                let minCheckout = new Date(this.value);
                minCheckout.setDate(minCheckout.getDate() + 1);
                let minCheckStr = getLocalISODate(minCheckout);
                
                checkoutInput.min = minCheckStr;
                
                // Eğer çıkış tarihi, giriş tarihinden eskiyse otomatik düzelt
                if(!checkoutInput.value || checkoutInput.value < minCheckStr) {
                    checkoutInput.value = minCheckStr;
                }
            });
        }
    });
</script>
<style>
    /* Arama formundaki kaybolan yazıları (İl, İlçe, Giriş vb.) belirginleştir */
    label {
        color: #f8fafc !important; /* Bembeyaz ve net */
        font-weight: 600 !important; /* Biraz kalınlaştır */
        letter-spacing: 0.5px; /* Harf arasını aç ki şık dursun */
        text-transform: uppercase; /* Hepsini büyük harf yap */
        font-size: 0.85rem; /* Boyutunu orantıla */
        margin-bottom: 8px;
    }
</style>
{% endblock %}
