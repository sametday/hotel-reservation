{% extends "base.html" %}
{% block content %}

<!-- GÖZ ALICI ARKA PLAN VE BAŞLIK (HERO SECTION) -->
<!-- Arka plan resmi artık CSS sınıfı olan "hero-bg" ile sağlanıyor -->
<div class="position-relative d-flex align-items-center justify-content-center hero-bg">
    
    <div class="container position-relative" style="z-index: 2;">
        <div class="text-center mb-5 mt-4">
            <h1 class="display-3 fw-bold text-white mb-3" style="text-shadow: 0 4px 15px rgba(0,0,0,0.5); letter-spacing: -1px;">
                {{ t('hero_title') }}
            </h1>
            <p class="fs-5 text-white-50 fw-light">{{ t('hero_desc') }}</p>
        </div>

        <!-- ARAMA FORMU (BUZLU CAM EFEKTLİ) -->
        <div class="card border-0 rounded-4 p-4 glass-card mx-auto" style="max-width: 1050px;">
            <form action="/search" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label text-white fw-bold small text-uppercase"><i class="bi bi-geo-alt me-1 text-info"></i> {{ t('city') }}</label>
                        <select name="city" id="citySelect" class="form-select form-select-lg glass-input" required>
                            <option value="">{{ t('select') }}</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label text-white fw-bold small text-uppercase"><i class="bi bi-pin-map me-1 text-info"></i> {{ t('district') }}</label>
                        <select name="district" id="districtSelect" class="form-select form-select-lg glass-input">
                            <option value="">{{ t('select_city_first') }}</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-white fw-bold small text-uppercase"><i class="bi bi-calendar-check me-1 text-info"></i> {{ t('checkin') }}</label>
                        <input type="date" name="checkin" id="checkin" class="form-control form-control-lg glass-input" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-white fw-bold small text-uppercase"><i class="bi bi-calendar-x me-1 text-info"></i> {{ t('checkout') }}</label>
                        <input type="date" name="checkout" id="checkout" class="form-control form-control-lg glass-input" required>
                    </div>
                    <div class="col-md-1">
                        <label class="form-label text-white fw-bold small text-uppercase">{{ t('adults') }}</label>
                        <input type="number" name="adults" class="form-control form-control-lg glass-input text-center" value="2" min="1" required>
                    </div>
                    <div class="col-md-1">
                        <label class="form-label text-white fw-bold small text-uppercase">{{ t('children') }}</label>
                        <input type="number" name="children" class="form-control form-control-lg glass-input text-center" value="0" min="0">
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-lg w-100 fw-bold shadow text-white border-0" style="background: linear-gradient(45deg, #38bdf8, #0ea5e9); border-radius: 12px; font-size: 1.2rem; transition: transform 0.2s;">
                            <i class="bi bi-search me-2"></i> {{ t('search_btn') }}
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    /* 📸 CSS İLE SAĞLAMA ALINMIŞ ARKA PLAN FOTOĞRAFI */
    .hero-bg {
        min-height: 85vh;
        background-image: linear-gradient(rgba(15, 23, 42, 0.5), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1542314831-c6a4d27ce006?q=80&w=2000&auto=format&fit=crop');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    /* Tasarım ve Buzlu Cam Efektleri */
    .glass-card { 
        background: rgba(30, 41, 59, 0.6); 
        backdrop-filter: blur(16px); 
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255,255,255,0.1) !important; 
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .glass-input { 
        background-color: rgba(0, 0, 0, 0.2) !important; 
        border: 1px solid rgba(255, 255, 255, 0.1) !important; 
        color: #f8fafc !important; 
        transition: all 0.3s ease; 
    }
    .glass-input:focus { 
        background-color: rgba(0, 0, 0, 0.4) !important; 
        border-color: #38bdf8 !important; 
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.3) !important; 
    }
    .glass-input option { 
        background-color: #1e293b; 
        color: #fff; 
    }
    input[type="date"]::-webkit-calendar-picker-indicator { 
        filter: invert(1); 
        opacity: 0.7; 
        cursor: pointer; 
    }
    button[type="submit"]:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(56, 189, 248, 0.4) !important;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        function getLocalISODate(date) {
            let offset = date.getTimezoneOffset() * 60000;
            return (new Date(date - offset)).toISOString().split('T')[0];
        }
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);

        const checkinInput = document.getElementById('checkin');
        const checkoutInput = document.getElementById('checkout');

        if (checkinInput && checkoutInput) {
            checkinInput.min = getLocalISODate(today);
            checkoutInput.min = getLocalISODate(tomorrow);

            checkinInput.addEventListener('change', function() {
                let minCheckout = new Date(this.value);
                minCheckout.setDate(minCheckout.getDate() + 1);
                let minCheckStr = getLocalISODate(minCheckout);
                checkoutInput.min = minCheckStr;
                if(!checkoutInput.value || checkoutInput.value < minCheckStr) {
                    checkoutInput.value = minCheckStr;
                }
            });
        }

        const citySelect = document.getElementById('citySelect');
        const districtSelect = document.getElementById('districtSelect');

        if (citySelect && districtSelect) {
            fetch('/api/v1/locations')
                .then(response => response.json())
                .then(res => {
                    if(res.status === "success") {
                        const locationData = res.data;
                        Object.keys(locationData).sort().forEach(city => {
                            const option = document.createElement('option');
                            option.value = city;
                            option.textContent = city;
                            citySelect.appendChild(option);
                        });

                        citySelect.addEventListener('change', function() {
                            const selectedCity = this.value;
                            districtSelect.innerHTML = ''; 
                            if(selectedCity && locationData[selectedCity]) {
                                districtSelect.innerHTML = '<option value="">{{ t("select") }}</option>';
                                locationData[selectedCity].forEach(district => {
                                    const option = document.createElement('option');
                                    option.value = district;
                                    option.textContent = district;
                                    districtSelect.appendChild(option);
                                });
                            } else {
                                districtSelect.innerHTML = '<option value="">{{ t("select_city_first") }}</option>';
                            }
                        });
                    }
                })
                .catch(error => console.error("API Hatası:", error));
        }
    });
</script>
{% endblock %}
