{% extends "base.html" %}
{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 rounded-4 p-4 shadow" style="background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px);">
                <div class="card-body text-center">
                    <i class="bi bi-key-fill display-4 text-success"></i>
                    <h3 class="fw-bold mt-2 text-white">Yeni Şifre Belirle</h3>
                    <form action="/reset-password/{{ token }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-4 text-start">
                            <input type="password" name="password" class="form-control form-control-lg bg-dark text-white border-secondary" placeholder="Yeni Şifreniz" required minlength="6">
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-bold py-2">Şifremi Güncelle</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
